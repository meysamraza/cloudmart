name: Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sast-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit SAST scan
        run: bandit -r . -f json -o bandit-report.json || true

      - name: Commit Bandit report to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add bandit-report.json
          git commit -m "Add Bandit scan report [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push

      - name: Check for critical findings
        run: |
          python -c "
          import json
          with open('bandit-report.json') as f:
              data = json.load(f)
          high = [r for r in data['results'] if r['issue_severity'] == 'HIGH']
          if high:
              print(f'BLOCKED: {len(high)} high-severity issue(s) found')
              exit(1)
          else:
              print('No high-severity issues found')
          "

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cloudmart:latest .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cloudmart:latest'
          format: 'json'
          output: 'trivy-report.json'
          severity: 'CRITICAL,HIGH'

      - name: Commit Trivy report to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add trivy-report.json
          git commit -m "Add Trivy scan report [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push

      - name: Check for critical findings
        run: |
          python3 -c "
          import json
          with open('trivy-report.json') as f:
              data = json.load(f)
          critical = []
          for result in data.get('Results', []):
              for vuln in result.get('Vulnerabilities', []) or []:
                  if vuln.get('Severity') == 'CRITICAL':
                      critical.append(vuln)
          if critical:
              print(f'BLOCKED: {len(critical)} critical vulnerability(ies) found')
              exit(1)
          else:
              print('No critical vulnerabilities found')
          "

  iac-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov IaC scan
        run: checkov -f main.tf -o json > checkov-report.json || true

      - name: Commit Checkov report to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add checkov-report.json
          git commit -m "Add Checkov scan report [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push

      - name: Check for failed checks
        run: |
          python3 -c "
          import json
          with open('checkov-report.json') as f:
              data = json.load(f)
          results = data if isinstance(data, list) else [data]
          failed = []
          for r in results:
              failed.extend(r.get('results', {}).get('failed_checks', []))
          if failed:
              print(f'BLOCKED: {len(failed)} failed IaC check(s) found')
              exit(1)
          else:
              print('No failed IaC checks found')
          "